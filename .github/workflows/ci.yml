name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, build & links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Astro check (types + templates)
        run: npx astro check
      - name: Type-check the Worker
        run: npm run check:worker
      - name: Build
        run: npm run build
        env:
          # PRs are previews: include future-dated (scheduled) posts so they get type, link and Lighthouse checks too.
          SHOW_FUTURE_POSTS: ${{ github.event_name == 'pull_request' && '1' || '' }}
      - name: Internal link check
        run: npm run check:links
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run Lighthouse on key pages
        run: npx --yes @lhci/cli@0.15.x autorun
